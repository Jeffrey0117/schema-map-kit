<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /* 版面:左邊固定目錄(領域 → 資料表),右邊一欄等寬字的資料表區塊;手機時目錄收成可展開的一塊 */
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --fg: #1b2330;
    --muted: #667085;
    --line: #dce1e9;
    --accent: #2b5fd3;
    --type: #0c7a6b;
    --chip: #e9eef6;
    --mark: #fff1b8;
    --font-text: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, "Noto Sans TC", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13161b; --surface: #1a1e25; --fg: #e3e7ee; --muted: #8e98a8; --line: #2a303b;
      --accent: #82a6ff; --type: #5fcfbb; --chip: #252b36; --mark: #5a4a12;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13161b; --surface: #1a1e25; --fg: #e3e7ee; --muted: #8e98a8; --line: #2a303b;
    --accent: #82a6ff; --type: #5fcfbb; --chip: #252b36; --mark: #5a4a12;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-text);
    font-size: 15px;
    line-height: 1.6;
  }
  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .top h1 { font-size: 22px; font-weight: 700; margin: 0; text-wrap: balance; }
  .tabs { display: flex; gap: 4px; background: var(--chip); padding: 4px; border-radius: 8px; }
  .tabs a {
    padding: 5px 14px; border-radius: 6px; text-decoration: none; color: var(--muted);
    font-size: 14px; font-weight: 500;
  }
  .tabs a[aria-current="page"] { background: var(--surface); color: var(--fg); }
  .search { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .search input {
    flex: 1; min-width: 0; padding: 8px 12px; font: inherit; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  }
  .search output { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  a:focus-visible, input:focus-visible, summary:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .intro { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin: 0; padding: 0; list-style: none; }
  .legend code { font-family: var(--font-mono); color: var(--fg); }

  .layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: start; }
  .toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; font-size: 13px; }
  .toc summary { display: none; }
  .toc h2 { font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 4px; letter-spacing: 0.04em; }
  .toc h2:first-of-type { margin-top: 0; }
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc a {
    display: block; padding: 2px 8px; border-radius: 5px; color: var(--fg); text-decoration: none;
    font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .toc a:hover { background: var(--chip); }

  .content { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .domain { font-size: 17px; font-weight: 700; margin: 18px 0 0; padding-bottom: 6px; border-bottom: 2px solid var(--fg); text-wrap: balance; }
  .domain:first-child { margin-top: 0; }

  .table { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; scroll-margin-top: 12px; }
  .table header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .table h3 { margin: 0; font-family: var(--font-mono); font-size: 16px; font-weight: 700; }
  .table header p { margin: 0; font-size: 13px; color: var(--muted); min-width: 0; }
  .rows { overflow-x: auto; padding: 8px 0; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr); padding: 1px 14px; font-family: var(--font-mono); font-size: 13px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row.sub { padding-left: 38px; color: var(--muted); }
  .row.note { font-family: var(--font-text); color: var(--muted); padding-top: 3px; }
  .name { font-weight: 500; }
  .opt { color: var(--muted); }
  .type { color: var(--type); }
  .fn { color: var(--accent); font-weight: 500; }
  .cmt { color: var(--muted); font-family: var(--font-text); }
  .pk { font-size: 11px; font-weight: 700; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
  .fk { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); cursor: pointer; background: none; border-top: 0; border-left: 0; border-right: 0; padding: 0; font: inherit; }
  .vals { background: var(--chip); border-radius: 4px; padding: 1px 6px; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .notes { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); padding: 30px 0; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .toc { position: static; max-height: none; overflow: visible; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
    .toc summary { display: block; padding: 9px 14px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .toc .toc-body { max-height: 45vh; overflow-y: auto; padding: 0 8px 10px; }
  }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="page">
  <div class="top">
    <h1>__TITLE__</h1>
    <nav class="tabs" id="tabs" aria-label="檢視">
      <a href="#core" id="tab-core">核心地圖</a>
      <a href="#all" id="tab-all">全部資料表</a>
    </nav>
    <div class="search">
      <input id="q" type="search" placeholder="找資料表或欄位,例如 tenant_id、status" autocomplete="off" aria-label="搜尋資料表或欄位">
      <output id="count" for="q"></output>
    </div>
  </div>
  <p class="intro" id="intro"></p>
  <ul class="legend">
    <li><code>name?</code> 可以是空的</li>
    <li><code>PK</code> 主鍵</li>
    <li><code>-&gt; 表.欄位</code> 指向另一張表,點了會跳過去</li>
    <li><code>{ a | b }</code> 正式資料裡出現過的值</li>
    <li><code>fn()</code> 判斷寫在哪支程式</li>
  </ul>
  <div class="layout">
    <details class="toc" id="toc" open>
      <summary>目錄</summary>
      <div class="toc-body" id="toc-body"></div>
    </details>
    <main class="content" id="content"></main>
  </div>
</div>

<script type="application/json" id="schema-data">/*__DATA__*/</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById("schema-data").textContent);
  var hasCore = typeof data.core === "string" && data.core.length > 0;
  var INTRO = {
    core: "主幹資料表,按領域分組。只列規劃時會用到的欄位,並補上 json 裡的 key 和判斷邏輯在哪支程式。手寫的,這頁產生於 " + data.generatedAt + "。",
    all: "資料庫現況的全部資料表,照字母排。自動產生,這頁產生於 " + data.generatedAt + "。"
  };

  /*__PARSER__*/

  function esc(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function splitComment(text) {
    var at = text.search(/\s+#(\s|$)/);
    if (at < 0) return { body: text, comment: "" };
    return { body: text.slice(0, at), comment: text.slice(at).replace(/^\s+#\s?/, "") };
  }

  function decorate(rest, known) {
    return esc(rest)
      .replace(/\{([^}]*)\}/g, '<span class="vals">$1</span>')
      .replace(/\(PK(, )?/g, function (m, comma) { return '<span class="pk">PK</span>' + (comma ? " (" : "("); })
      .replace(/\(\)/g, "")
      .replace(/-&gt; ([a-z0-9_]+)\.([a-z0-9_]+)/g, function (m, table, column) {
        return known[table]
          ? '<button type="button" class="fk" data-jump="' + table + '">-&gt; ' + table + "." + column + "</button>"
          : "-&gt; " + table + "." + column;
      })
      .replace(/\((<button[^]*?<\/button>)\)/g, "$1");
  }

  function renderLine(line, known) {
    if (line.charAt(0) === "#") {
      return '<div class="row note">' + esc(line.replace(/^#\s?/, "")) + "</div>";
    }
    var parts = splitComment(line);
    var comment = parts.comment ? '  <span class="cmt">' + esc(parts.comment) + "</span>" : "";
    if (line.charAt(0) !== "-") {
      var body = parts.body.replace(/^\s+/, "");
      if (!body) return '<div class="row sub"><span class="cmt">' + esc(parts.comment) + "</span></div>";
      return '<div class="row sub">' + esc(body) + comment + "</div>";
    }
    var text = parts.body.slice(2);
    var colon = text.indexOf(": ");
    if (colon < 0) {
      var fnMatch = /^(.*\(\)(?:\s*\/\s*[A-Za-z]+\(\))*)\s*(.*)$/.exec(text);
      if (fnMatch && text.indexOf("()") >= 0) {
        return '<div class="row"><span><span class="fn">' + esc(fnMatch[1]) + "</span>  " + esc(fnMatch[2]) + comment + "</span></div>";
      }
      return '<div class="row"><span><span class="name">' + esc(text) + "</span>" + comment + "</span></div>";
    }
    var name = text.slice(0, colon).replace(/\?/g, '<span class="opt">?</span>');
    var rest = text.slice(colon + 2);
    var typeEnd = rest.search(/\s{2,}|\s\(|\s\{/);
    var type = typeEnd < 0 ? rest : rest.slice(0, typeEnd);
    var tail = typeEnd < 0 ? "" : rest.slice(typeEnd);
    return (
      '<div class="row"><span><span class="name">' + name + '</span>: <span class="type">' + esc(type) + "</span>" +
      decorate(tail, known) + comment + "</span></div>"
    );
  }

  function highlight(html, query) {
    if (!query) return html;
    var pattern = new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "gi");
    return html.replace(pattern, "<mark>$1</mark>");
  }

  var views = { core: hasCore ? parseMap(data.core) : [], all: parseMap(data.all) };
  var content = document.getElementById("content");
  var tocBody = document.getElementById("toc-body");
  var input = document.getElementById("q");
  var count = document.getElementById("count");

  function currentView() {
    if (!hasCore) return "all";
    return location.hash === "#all" ? "all" : "core";
  }

  function render() {
    var view = currentView();
    var sections = views[view];
    var query = input.value.trim().toLowerCase();
    var known = {};
    sections.forEach(function (s) { s.tables.forEach(function (t) { known[t.name] = true; }); });

    var html = "";
    var toc = "";
    var shown = 0;
    var total = 0;
    sections.forEach(function (section) {
      total += section.tables.length;
      var tables = section.tables.filter(function (t) {
        if (!query) return true;
        return (t.name + "\n" + t.comment + "\n" + t.lines.join("\n")).toLowerCase().indexOf(query) >= 0;
      });
      if (tables.length === 0 && (query || section.notes.length === 0)) return;
      shown += tables.length;
      if (section.title) {
        html += '<h2 class="domain">' + esc(section.title) + "</h2>";
        toc += "<h2>" + esc(section.title.replace(/\(.*$/, "")) + "</h2>";
      }
      if (section.notes.length > 0 && !query) {
        html += '<div class="notes">' + section.notes.map(function (n) { return "<div>" + esc(n) + "</div>"; }).join("") + "</div>";
      }
      toc += "<ul>";
      tables.forEach(function (t) {
        var rows = t.lines.map(function (line) { return renderLine(line, known); }).join("");
        html +=
          '<section class="table" id="t-' + t.name + '"><header><h3>' + highlight(esc(t.name), query) + "</h3>" +
          (t.comment ? "<p>" + highlight(esc(t.comment), query) + "</p>" : "") +
          '</header><div class="rows">' + highlight(rows, query) + "</div></section>";
        toc += '<li><a href="#" data-jump="' + t.name + '">' + esc(t.name) + "</a></li>";
      });
      toc += "</ul>";
    });

    content.innerHTML = html || '<p class="empty">找不到符合「' + esc(query) + "」的資料表或欄位。</p>";
    tocBody.innerHTML = toc;
    count.textContent = query ? shown + " / " + total + " 張表" : total + " 張表";
    document.getElementById("intro").textContent = INTRO[view];
    document.getElementById("tab-core").toggleAttribute("aria-current", view === "core");
    document.getElementById("tab-all").toggleAttribute("aria-current", view === "all");
    if (view === "core") document.getElementById("tab-core").setAttribute("aria-current", "page");
    if (view === "all") document.getElementById("tab-all").setAttribute("aria-current", "page");
  }

  document.addEventListener("click", function (event) {
    var target = event.target.closest("[data-jump]");
    if (!target) return;
    event.preventDefault();
    var el = document.getElementById("t-" + target.getAttribute("data-jump"));
    if (el) el.scrollIntoView({ block: "start" });
    if (window.matchMedia("(max-width: 820px)").matches) document.getElementById("toc").open = false;
  });
  input.addEventListener("input", render);
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });

  if (!hasCore) document.getElementById("tabs").hidden = true;
  if (window.matchMedia("(max-width: 820px)").matches) document.getElementById("toc").open = false;
  render();
})();
</script>
